; DUM-E arm controller v5 (ESP32-DevKitC-32D)
;
; Platform: pioarduino (arduino-esp32 3.3.x / ESP-IDF 5.5), pinned so builds are reproducible.
; Same platform as the claw (the ESP32-C5 needs it), so one toolchain covers both boards.
; Libraries come from pinned GitHub tags rather than the PlatformIO registry.

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
	-I ../shared/include
	-Wall
lib_deps =
	https://github.com/gin66/FastAccelStepper.git#1.3.4
	https://github.com/waspinator/AccelStepper.git#1.64
	https://github.com/ThingPulse/esp8266-oled-ssd1306.git#4.6.2

; Fallback: the original AccelStepper (steps bit-banged from loop()).
[env:esp32dev_accelstepper]
extends = env:esp32dev
build_flags =
	${env:esp32dev.build_flags}
	-D USE_ACCELSTEPPER
