; DUM-E 3-finger tendon claw (ClawGripperPCB, Waveshare ESP32-C5-MINI-KIT)
;
; The ESP32-C5 needs arduino-esp32 3.3+, which the official PlatformIO espressif32 platform does
; not ship; pioarduino does. Same pinned release as the arm controller.

[env:esp32c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
; ESP32-C5-DevKitC-1 definition (4 MB flash, no PSRAM) also fits the Waveshare MINI-KIT; 4 MB
; is the smallest ESP32-C5-MINI-1 variant, so this works whatever flash size is fitted.
board = esp32-c5-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
	-I ../shared/include
	-Wall
	; the MINI-KIT's USB port is the chip's native USB (GPIO13/14): route Serial there
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
